<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>StopWatch</title>
</head>
<body>
    <div class="container-box">
    <h1>Lets Start with! Stop Watch </h1>
    <div class="display">
        <h2 id="time">00:00:00</h2>
    </div>
    
        <div class="button-display">
        <button type="button" class="btn btn-outline-success"onclick = "start()">Start</button>
        <button type="button" class="btn btn-outline-danger"onclick="stop()">Stop</button>
        <button type="button" class="btn btn-outline-warning"onclick="reset()">Reset</button>
    </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
